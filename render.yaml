services:
  # -------------------------------------------------------------
  # Backend Web Service (Spring Boot 3 + TiDB Cloud)
  # -------------------------------------------------------------
  - type: web
    name: smartprocure-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/smartprocure-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: tidb
      - key: JAVA_VERSION
        value: "17"

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: smartprocure-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://smartprocure-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
